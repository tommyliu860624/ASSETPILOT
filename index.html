<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AssetPilot V24.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-text { text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .blur-content { filter: blur(6px); opacity: 0.7; transition: all 0.3s ease; user-select: none; }
        .no-blur { filter: blur(0); opacity: 1; transition: all 0.3s ease; }
        .modal-overlay { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-ring { box-shadow: 0 0 0 2px #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- STREAMING_CHUNK:Audio Context ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playSound = (type, enabled) => {
            if (!enabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'tap') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.start(); osc.stop(audioCtx.currentTime + 0.05); }
            else if (type === 'pop') { osc.type = 'square'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
            else if (type === 'success') { osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
            else if (type === 'delete') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
            else if (type === 'switch') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08); }
        };

        const Icon = ({ name, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => { if (iconRef.current && window.lucide) { window.lucide.createIcons({ icons: { [name]: true }, attrs: { class: className }, nameAttr: 'data-lucide' }); iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`; } }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const formatMoney = (val) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val).replace('TWD', 'NTD');
        const calculateDiff = (current, previous) => {
            if (previous === 0) return { val: current, pct: current > 0 ? 100 : 0, isPos: current >= 0 };
            const diff = current - previous;
            return { val: diff, pct: (diff / previous) * 100, isPos: diff >= 0 };
        };

        // --- STREAMING_CHUNK:API Fetching ---
        const PROXY_URL = 'https://assetpilot-proxy.tommyliu860624.workers.dev';

        const fetchYahooData = async (symbols) => {
            if (symbols.length === 0) return {};
            try {
                const query = symbols.join(',');
                const targetUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${query}`;
                const url = `${PROXY_URL}/?url=${encodeURIComponent(targetUrl)}`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                const data = await res.json();
                const results = {};
                if (data.quoteResponse && data.quoteResponse.result) {
                    data.quoteResponse.result.forEach(item => { results[item.symbol] = item.regularMarketPrice; });
                }
                return results;
            } catch (err) {
                console.error("Fetch Yahoo Data Error:", err);
                return {};
            }
        };

        const searchYahooStocks = async (query) => {
            if (!query.trim()) return [];
            try {
                const targetUrl = `https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(query)}&quotesCount=8&newsCount=0`;
                const url = `${PROXY_URL}/?url=${encodeURIComponent(targetUrl)}`;
                const res = await fetch(url);
                if (!res.ok) return [];
                const data = await res.json();
                return data.quotes
                    .filter(q => q.quoteType === 'EQUITY' || q.quoteType === 'ETF')
                    .map(q => ({ symbol: q.symbol, name: q.longname || q.shortname || q.symbol, exchange: q.exchDisp }));
            } catch (err) {
                console.error("Search Error:", err);
                return [];
            }
        };

        // --- STREAMING_CHUNK:Charts Component ---
        const AssetTrendChart = ({ history, timeRange, mode, customDates, isPrivacyMode }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            
            const filteredData = useMemo(() => {
                if(!history || history.length === 0) return [];
                const parseDate = (str) => new Date(str.replace(/-/g, '/')); 
                let chartHistory = [...history];
                chartHistory.sort((a, b) => a.date.localeCompare(b.date));
                let rangeData = [];
                if (timeRange === 'CUSTOM' && customDates.start && customDates.end) {
                     const s = parseDate(customDates.start); const e = parseDate(customDates.end);
                     rangeData = chartHistory.filter(h => { const d = parseDate(h.date); return d >= s && d <= e; });
                } else { rangeData = chartHistory; }
                
                if (timeRange === '日' || timeRange === 'CUSTOM') {
                    // 去重：同一天只留最後一筆
                    const uniqueDays = {};
                    rangeData.forEach(h => { uniqueDays[h.date.substring(0, 10)] = h; });
                    return Object.values(uniqueDays).sort((a, b) => a.date.localeCompare(b.date));
                }
                
                const groups = {};
                rangeData.forEach(item => {
                    const d = parseDate(item.date);
                    let key = timeRange === '月' ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : `${d.getFullYear()}`;
                    groups[key] = item; 
                });
                return Object.values(groups).sort((a, b) => a.date.localeCompare(b.date));
            }, [history, timeRange, customDates]);

            const displayData = useMemo(() => filteredData.map(h => mode === 'total' ? h.total : h[mode] || 0), [filteredData, mode]);
            const labels = useMemo(() => filteredData.map(h => timeRange === '年' ? h.date.substring(0, 4) : timeRange === '月' ? h.date.substring(0, 7) : h.date.slice(5).replace('-', '/')), [filteredData, timeRange]);

            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                let color = mode === 'cashTW' ? '#10b981' : mode === 'stockTW' ? '#0ea5e9' : mode === 'cashForeign' ? '#a855f7' : mode === 'stockForeign' ? '#ec4899' : '#3b82f6';
                
                const gradient = ctx.createLinearGradient(0, 0, 0, 300); 
                gradient.addColorStop(0, color + '80'); gradient.addColorStop(1, color + '00');
                
                const pointRadii = displayData.map((_, i) => i === displayData.length - 1 ? 5 : 0);
                const pointColors = displayData.map((_, i) => i === displayData.length - 1 ? '#fff' : color);
                const pointBorderWidths = displayData.map((_, i) => i === displayData.length - 1 ? 2 : 0);

                const maxVal = displayData.length > 0 ? Math.max(...displayData) : 0;
                const minVal = displayData.length > 0 ? Math.min(...displayData) : 0;
                const padding = (maxVal - minVal) === 0 ? (maxVal * 0.05 || 10) : (maxVal - minVal) * 0.15;

                chartInstance.current = new Chart(ctx, { 
                    type: 'line', 
                    data: { 
                        labels: labels, 
                        datasets: [{ 
                            data: displayData, borderColor: color, backgroundColor: gradient, 
                            borderWidth: 2, pointRadius: pointRadii, pointBackgroundColor: pointColors, 
                            pointBorderColor: color, pointBorderWidth: pointBorderWidths, 
                            pointHitRadius: 20, fill: true, tension: 0.3
                        }] 
                    }, 
                    options: { 
                        responsive: true, maintainAspectRatio: false, 
                        interaction: { intersect: false, mode: 'index' }, 
                        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ` ${formatMoney(ctx.parsed.y)}` } } }, 
                        scales: { 
                            x: { grid: { display: false, drawBorder: false }, ticks: { color: '#64748b', font: {size: 10}, maxRotation: 0 } }, 
                            y: { display: false, min: Math.max(0, minVal - padding), max: maxVal + padding } 
                        },
                        layout: { padding: { left: 10, right: 15, top: 10, bottom: 0 } }
                    } 
                });
            }, [filteredData, displayData, labels, mode]);

            const calculatedWidth = Math.max(100, (displayData.length / 7) * 100);

            return (
                <div className={`w-full h-48 flex transition-all duration-300 ${isPrivacyMode ? 'blur-content' : 'no-blur'}`}>
                    <div className="flex-1 h-full overflow-x-auto hide-scrollbar">
                        <div style={{ width: `${calculatedWidth}%`, height: '100%' }}>
                            <canvas ref={chartRef} />
                        </div>
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK:Allocation Bar ---
        const AllocationBar = ({ cash, tw, us, total, isPrivacyMode, playSfx }) => {
            if (total === 0) return <div className="text-center text-xs text-slate-500 py-4">無資產數據</div>;
            const pCash = (cash / total) * 100; const pTw = (tw / total) * 100; const pUs = (us / total) * 100;
            const [selected, setSelected] = useState(null);
            const displayVal = (val) => isPrivacyMode ? '****' : formatMoney(val);
            const handleSelect = (type) => { playSfx('tap'); setSelected(selected === type ? null : type); };
            
            return (
                <div className={`w-full transition-all duration-300 ${isPrivacyMode ? 'blur-content' : ''}`}>
                    <div className="h-6 w-full flex rounded-full overflow-hidden cursor-pointer mb-3 bg-slate-800">
                        {pCash > 0 && <div style={{ flexGrow: pCash }} className="bg-emerald-500 hover:opacity-90" onClick={() => handleSelect('cash')}></div>}
                        {pTw > 0 && <div style={{ flexGrow: pTw }} className="bg-sky-500 hover:opacity-90" onClick={() => handleSelect('tw')}></div>}
                        {pUs > 0 && <div style={{ flexGrow: pUs }} className="bg-purple-500 hover:opacity-90" onClick={() => handleSelect('us')}></div>}
                    </div>
                    <div className="grid grid-cols-3 gap-2 text-center">
                        <div className={`p-2 rounded-xl transition-colors cursor-pointer ${selected === 'cash' ? 'bg-emerald-500/20 ring-1 ring-emerald-500' : 'hover:bg-slate-800'}`} onClick={() => handleSelect('cash')}><div className="flex items-center justify-center space-x-1 mb-1"><div className="w-2 h-2 rounded-full bg-emerald-500"></div><span className="text-xs text-slate-400">現金</span></div><div className="text-sm font-bold text-white">{pCash.toFixed(0)}%</div>{selected === 'cash' && <div className="text-[10px] text-emerald-400 font-mono mt-1">{displayVal(cash)}</div>}</div>
                        <div className={`p-2 rounded-xl transition-colors cursor-pointer ${selected === 'tw' ? 'bg-sky-500/20 ring-1 ring-sky-500' : 'hover:bg-slate-800'}`} onClick={() => handleSelect('tw')}><div className="flex items-center justify-center space-x-1 mb-1"><div className="w-2 h-2 rounded-full bg-sky-500"></div><span className="text-xs text-slate-400">台股</span></div><div className="text-sm font-bold text-white">{pTw.toFixed(0)}%</div>{selected === 'tw' && <div className="text-[10px] text-sky-400 font-mono mt-1">{displayVal(tw)}</div>}</div>
                        <div className={`p-2 rounded-xl transition-colors cursor-pointer ${selected === 'us' ? 'bg-purple-500/20 ring-1 ring-purple-500' : 'hover:bg-slate-800'}`} onClick={() => handleSelect('us')}><div className="flex items-center justify-center space-x-1 mb-1"><div className="w-2 h-2 rounded-full bg-purple-500"></div><span className="text-xs text-slate-400">外資</span></div><div className="text-sm font-bold text-white">{pUs.toFixed(0)}%</div>{selected === 'us' && <div className="text-[10px] text-purple-400 font-mono mt-1">{displayVal(us)}</div>}</div>
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK:Main App State ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isPrivacyMode, setIsPrivacyMode] = useState(() => { const saved = localStorage.getItem('ap_privacy'); return saved ? JSON.parse(saved) : false; });
            const [assets, setAssets] = useState(() => {
                const saved = localStorage.getItem('ap_assets');
                return saved ? JSON.parse(saved) : { cashTW: [], stockTW: [], cashForeign: [], stockForeign: [] };
            });
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('ap_history')) || []);
            const [targets, setTargets] = useState(() => JSON.parse(localStorage.getItem('ap_targets')) || []);
            const [walletOrder, setWalletOrder] = useState(() => JSON.parse(localStorage.getItem('ap_wallet_order')) || ['cashTW', 'cashForeign', 'stockTW', 'stockForeign']);
            const [userName, setUserName] = useState(() => localStorage.getItem('ap_user_name') || 'User');
            const [soundEnabled, setSoundEnabled] = useState(() => { const saved = localStorage.getItem('ap_sound_enabled'); return saved !== null ? JSON.parse(saved) : true; });
            const [sops, setSops] = useState(() => JSON.parse(localStorage.getItem('ap_sops')) || [{ id: '1', text: '月底結算資產', completed: false }, { id: '2', text: '檢查信用卡帳單', completed: false }]);
            
            const [isUpdating, setIsUpdating] = useState(false);
            const [updateModal, setUpdateModal] = useState({ show: false, logs: [] });
            const [confirmModal, setConfirmModal] = useState({ show: false, title: '', msg: '', onConfirm: null });
            const [toast, setToast] = useState({ show: false, message: '' });

            const playSfx = useCallback((type) => playSound(type, soundEnabled), [soundEnabled]);

            useEffect(() => { localStorage.setItem('ap_assets', JSON.stringify(assets)); }, [assets]);
            useEffect(() => { localStorage.setItem('ap_history', JSON.stringify(history)); }, [history]);
            useEffect(() => { localStorage.setItem('ap_targets', JSON.stringify(targets)); }, [targets]);
            useEffect(() => { localStorage.setItem('ap_wallet_order', JSON.stringify(walletOrder)); }, [walletOrder]);
            useEffect(() => { localStorage.setItem('ap_privacy', JSON.stringify(isPrivacyMode)); }, [isPrivacyMode]);
            useEffect(() => { localStorage.setItem('ap_user_name', userName); }, [userName]);
            useEffect(() => { localStorage.setItem('ap_sound_enabled', JSON.stringify(soundEnabled)); }, [soundEnabled]);
            useEffect(() => { localStorage.setItem('ap_sops', JSON.stringify(sops)); }, [sops]);

            const showToast = (msg) => { setToast({ show: true, message: msg }); setTimeout(() => setToast({ show: false, message: '' }), 3000); };

            // --- STREAMING_CHUNK:Calculations ---
            const totalCashTWD = assets.cashTW.reduce((sum, item) => sum + Number(item.amount), 0);
            const totalTwStocksTWD = assets.stockTW.reduce((sum, item) => sum + (Number(item.shares) * Number(item.price)), 0);
            const totalForeignAssetsTWD = assets.cashForeign.reduce((sum, item) => sum + (Number(item.originalAmount) * Number(item.exchangeRate)), 0) + assets.stockForeign.reduce((sum, item) => sum + (Number(item.shares) * Number(item.price) * Number(item.exchangeRate)), 0);
            const totalNetWorth = totalCashTWD + totalTwStocksTWD + totalForeignAssetsTWD;

            // --- STREAMING_CHUNK:Live Data Fetching ---
            const handleRefreshData = async () => {
                playSfx('tap');
                setIsUpdating(true);
                let logs = [];
                
                try {
                    // Gather all required symbols for stocks
                    const twSymbols = assets.stockTW.map(s => s.symbol);
                    const usSymbols = assets.stockForeign.map(s => s.symbol);
                    
                    // Gather required currencies (Default to USD for foreign stocks if no specific currency is set, but we assume USD)
                    const currencies = new Set();
                    assets.cashForeign.forEach(c => currencies.add(`${c.currency}TWD=X`));
                    assets.stockForeign.forEach(c => currencies.add(`USDTWD=X`)); // Assuming US stocks
                    const currencySymbols = Array.from(currencies);
                    
                    const allSymbols = [...twSymbols, ...usSymbols, ...currencySymbols];
                    
                    if (allSymbols.length > 0) {
                        const prices = await fetchYahooData(allSymbols);
                        
                        let updatedAssets = { ...assets };
                        
                        // Update TW Stocks
                        updatedAssets.stockTW = assets.stockTW.map(s => {
                            if (prices[s.symbol]) {
                                if (prices[s.symbol] !== s.price) logs.push(`[台股] ${s.name} (${s.symbol}): ${s.price} ➔ ${prices[s.symbol]}`);
                                else logs.push(`[台股] ${s.name}: 無變動 (${prices[s.symbol]})`);
                                return { ...s, price: prices[s.symbol] };
                            }
                            logs.push(`[台股] ${s.name}: 未獲取新報價，保留原價`);
                            return s;
                        });

                        // Update US Stocks
                        updatedAssets.stockForeign = assets.stockForeign.map(s => {
                            let newPrice = s.price;
                            let newRate = s.exchangeRate;
                            if (prices[s.symbol]) {
                                if (prices[s.symbol] !== s.price) logs.push(`[外股] ${s.name} (${s.symbol}): $${s.price} ➔ $${prices[s.symbol]}`);
                                else logs.push(`[外股] ${s.name}: 無變動 ($${prices[s.symbol]})`);
                                newPrice = prices[s.symbol];
                            } else {
                                logs.push(`[外股] ${s.name}: 未獲取新報價，保留原價`);
                            }
                            if (prices['USDTWD=X']) newRate = prices['USDTWD=X'];
                            return { ...s, price: newPrice, exchangeRate: newRate };
                        });

                        // Update Foreign Cash Exchange Rates
                        updatedAssets.cashForeign = assets.cashForeign.map(c => {
                            const pair = `${c.currency}TWD=X`;
                            if (prices[pair]) {
                                if (prices[pair] !== c.exchangeRate) logs.push(`[匯率] ${c.currency}: ${c.exchangeRate} ➔ ${prices[pair]}`);
                                return { ...c, exchangeRate: prices[pair] };
                            }
                            return c;
                        });

                        setAssets(updatedAssets);
                    } else {
                        logs.push("沒有需要更新的股票或外幣部位。");
                    }
                    playSfx('success');
                } catch (error) {
                    logs.push(`連線失敗: ${error.message}`);
                    playSfx('delete');
                } finally {
                    setUpdateModal({ show: true, logs });
                    setIsUpdating(false);
                }
            };

            const recordHistory = () => {
                if (totalNetWorth === 0) return;
                playSfx('success');
                const now = new Date();
                const dString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                setHistory(prev => [...prev, {
                    id: Date.now().toString(),
                    date: dString,
                    total: totalNetWorth,
                    cashTW: totalCashTWD,
                    stockTW: totalTwStocksTWD,
                    cashForeign: assets.cashForeign.reduce((sum, item) => sum + (Number(item.originalAmount) * Number(item.exchangeRate)), 0),
                    stockForeign: assets.stockForeign.reduce((sum, item) => sum + (Number(item.shares) * Number(item.price) * Number(item.exchangeRate)), 0)
                }]);
                showToast("已成功紀錄今日資產結算！");
            };

            const handleDeleteAsset = (category, id) => {
                playSfx('delete');
                setAssets(prev => ({ ...prev, [category]: prev[category].filter(item => item.id !== id) }));
                // Cleanup goals
                setTargets(prev => prev.map(t => ({ ...t, linkedAccounts: t.linkedAccounts.filter(linkId => linkId !== id) })));
            };

            // --- STREAMING_CHUNK:Sub-components ---
            const DashboardTab = () => {
                const firstRecord = history.length > 0 ? history[0].total : totalNetWorth;
                const ytd = calculateDiff(totalNetWorth, firstRecord);
                const [isEditingSop, setIsEditingSop] = useState(false);
                const [newSop, setNewSop] = useState('');

                return (
                    <div className="space-y-4 pb-20 animate-fade-in">
                        <div className="glass-panel rounded-3xl p-6 relative overflow-hidden shadow-2xl">
                            <div className="absolute -right-10 -top-10 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl"></div>
                            <div className="absolute -left-10 -bottom-10 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl"></div>
                            <div className="relative z-10">
                                <div className="flex justify-between items-start mb-2">
                                    <div className="text-sm text-slate-400 font-medium tracking-wider">TOTAL NET WORTH</div>
                                    <button onClick={handleRefreshData} disabled={isUpdating} className={`p-2 bg-slate-800 rounded-full hover:bg-slate-700 transition-colors ${isUpdating ? 'animate-spin opacity-50' : ''}`}>
                                        <Icon name="refresh-cw" className="w-4 h-4 text-blue-400" />
                                    </button>
                                </div>
                                <div className={`text-4xl font-black text-white tracking-tight mb-4 ${isPrivacyMode ? 'blur-content' : 'neon-text'}`}>
                                    {isPrivacyMode ? 'NTD ****' : formatMoney(totalNetWorth)}
                                </div>
                                <div className="flex space-x-3">

            // --- STREAMING_CHUNK:Vault Component ---

                const handleSave = () => {

                    const newItem = { id: Date.now().toString(), ...form, amount: Number(form.amount) };

                    if (!form.symbol || !form.name || !form.shares || !form.price) { showToast("請填寫完整資訊！"); return; }

                    const newItem = { id: Date.now().toString(), symbol: form.symbol.toUpperCase(), name: form.name, shares: Number(form.shares), price: Number(form.price), exchangeRate: addModal.type === 'stockForeign' ? (Number(form.exchangeRate) || 31.5) : 1 };

                                    <div className="flex justify-between items-center mb-6">

                                    <div className="space-y-4">
                                        {(addModal.type === 'stockTW' || addModal.type === 'stockForeign') ? (
                                            <>

                                                        <Icon name="search" className="w-4 h-4 absolute left-3 top-3 text-slate-500" />
                                                        <input type="text" value={searchQuery} onChange={e => {setSearchQuery(e.target.value); setForm({...form, symbol: e.target.value});}} placeholder="例如：台積電 或 2330" className="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-white focus:border-blue-500 outline-none" />

                                                                    <span className="text-sm text-white font-bold">{res.symbol}</span>

                                                <div><label className="text-xs text-slate-400 mb-1 block">自訂名稱</label><input type="text" value={form.name || ''} onChange={e => setForm({...form, name: e.target.value})} placeholder="例如：台積電" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:border-blue-500 outline-none" /></div>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div><label className="text-xs text-slate-400 mb-1 block">持有股數</label><input type="number" value={form.shares || ''} onChange={e => setForm({...form, shares: e.target.value})} placeholder="例如: 1000" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:border-blue-500 outline-none" /></div>
                                                    <div><label className="text-xs text-slate-400 mb-1 block">目前市價 (自動更新)</label><input type="number" value={form.price || ''} onChange={e => setForm({...form, price: e.target.value})} placeholder="例如: 900" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:border-blue-500 outline-none" /></div>

            // --- STREAMING_CHUNK:Reports Component ---
            const ReportsTab = () => {
                const [expandedYear, setExpandedYear] = useState(null);
                const [expandedMonth, setExpandedMonth] = useState(null);

                const yearlyData = useMemo(() => {
                    const years = {};
                    history.forEach(h => {
                        const date = new Date(h.date.replace(/-/g, '/'));
                        const y = date.getFullYear();
                        const m = `${y}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        if (!years[y]) years[y] = { year: y, months: {} };
                        if (!years[y].months[m] || date > new Date(years[y].months[m].date.replace(/-/g, '/'))) years[y].months[m] = h;
                    });
                    
                    const result = Object.values(years).sort((a, b) => b.year - a.year).map((yd, idx, arr) => {
                        const sortedMonths = Object.values(yd.months).sort((a, b) => b.date.localeCompare(a.date));
                        const yearLatest = sortedMonths[0].total;
                        const lastYearEnd = arr[idx + 1] ? Object.values(arr[idx + 1].months).sort((a, b) => b.date.localeCompare(a.date))[0].total : history[0]?.total || 0;
                        const yoy = calculateDiff(yearLatest, lastYearEnd);
                        
                        const monthDetails = sortedMonths.map((md, mIdx) => {
                            const prevMonthData = sortedMonths[mIdx + 1] || (arr[idx + 1] ? Object.values(arr[idx + 1].months).sort((a, b) => b.date.localeCompare(a.date))[0] : null);
                            const prevTotal = prevMonthData ? prevMonthData.total : md.total;
                            const mom = calculateDiff(md.total, prevTotal);
                            
                            const catDiffs = {
                                cashTW: calculateDiff(md.cashTW, prevMonthData ? prevMonthData.cashTW : md.cashTW),
                                stockTW: calculateDiff(md.stockTW, prevMonthData ? prevMonthData.stockTW : md.stockTW),
                                cashForeign: calculateDiff(md.cashForeign, prevMonthData ? prevMonthData.cashForeign : md.cashForeign),
                                stockForeign: calculateDiff(md.stockForeign, prevMonthData ? prevMonthData.stockForeign : md.stockForeign),
                            };
                            return { ...md, mom, catDiffs };
                        });
                        return { ...yd, yoy, latestTotal: yearLatest, months: monthDetails };
                    });
                    
                    if(result.length > 0 && !expandedYear) setExpandedYear(result[0].year);
                    return result;
                }, [history]);

                if (history.length === 0) return <div className="text-center text-slate-500 mt-10">尚無結算紀錄。去首頁點擊結算吧！</div>;

                return (
                    <div className="space-y-4 pb-20 animate-fade-in">
                        {yearlyData.map(yd => (
                            <div key={yd.year} className="glass-panel rounded-2xl overflow-hidden border border-slate-700/50">
                                <div onClick={() => { playSfx('tap'); setExpandedYear(expandedYear === yd.year ? null : yd.year); }} className="p-5 flex justify-between items-center cursor-pointer hover:bg-slate-800/50 transition-colors">

                                        <div className="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400 font-bold">{yd.year}</div>
                                        <div><div className="text-sm font-bold text-white">年度結算</div><div className={`text-xs ${isPrivacyMode ? 'blur-content text-slate-500' : 'text-slate-400'}`}>{isPrivacyMode ? 'NTD ****' : formatMoney(yd.latestTotal)}</div></div>
                                    </div>
                                    <div className="text-right flex items-center gap-3">
                                        <div>
                                            <div className={`text-sm font-bold ${isPrivacyMode ? 'text-slate-500 blur-content' : (yd.yoy.isPos ? 'text-emerald-400' : 'text-red-400')}`}>
                                                {isPrivacyMode ? '****' : `${yd.yoy.isPos ? '+' : ''}${formatMoney(yd.yoy.val)}`}
                                            </div>
                                            <div className={`text-xs ${isPrivacyMode ? 'text-slate-500 blur-content' : (yd.yoy.isPos ? 'text-emerald-500' : 'text-red-500')}`}>
                                                {isPrivacyMode ? '**.*%' : `${yd.yoy.isPos ? '▲' : '▼'} ${yd.yoy.pct.toFixed(1)}% YoY`}
                                            </div>
                                        </div>
                                        <Icon name={expandedYear === yd.year ? "chevron-up" : "chevron-down"} className="w-5 h-5 text-slate-500" />
                                    </div>
                                </div>

                                {expandedYear === yd.year && (
                                    <div className="bg-slate-900/50 border-t border-slate-700/50 p-2 space-y-2">
                                        {yd.months.map(md => (
                                            <div key={md.date} className="bg-slate-800/60 rounded-xl overflow-hidden">
                                                <div onClick={() => { playSfx('switch'); setExpandedMonth(expandedMonth === md.date ? null : md.date); }} className="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-700/50">
                                                    <span className="font-bold text-slate-200">{md.date.substring(5, 7)} 月</span>
                                                    <div className="flex items-center gap-4">
                                                        <span className={`text-sm font-mono ${isPrivacyMode ? 'text-slate-500 blur-content' : (md.mom.isPos ? 'text-emerald-400' : 'text-red-400')}`}>
                                                            {isPrivacyMode ? '****' : `${md.mom.isPos ? '+' : ''}${formatMoney(md.mom.val)}`}
                                                        </span>
                                                        <Icon name={expandedMonth === md.date ? "chevron-up" : "chevron-down"} className="w-4 h-4 text-slate-500" />
                                                    </div>
                                                </div>
                                                
                                                {expandedMonth === md.date && (
                                                    <div className="p-4 border-t border-slate-700/50 bg-slate-900/80 grid grid-cols-2 gap-3">
                                                        {[ {k:'cashTW', n:'台幣現金', c:'emerald'}, {k:'stockTW', n:'台股部位', c:'sky'}, {k:'cashForeign', n:'外幣現金', c:'purple'}, {k:'stockForeign', n:'海外證券', c:'pink'} ].map(cat => (
                                                            <div key={cat.k} className="p-3 bg-slate-800 rounded-lg border border-slate-700/50">
                                                                <div className="text-xs text-slate-400 mb-1 flex items-center gap-1"><div className={`w-1.5 h-1.5 rounded-full bg-${cat.c}-500`}></div>{cat.n}</div>
                                                                <div className={`font-mono text-sm mb-1 ${isPrivacyMode ? 'blur-content text-slate-500' : 'text-white'}`}>{isPrivacyMode ? '****' : formatMoney(md[cat.k])}</div>
                                                                <div className={`text-[10px] ${isPrivacyMode ? 'blur-content text-slate-500' : (md.catDiffs[cat.k].isPos ? 'text-emerald-400' : 'text-red-400')}`}>
                                                                    {isPrivacyMode ? '****' : `${md.catDiffs[cat.k].isPos ? '+' : ''}${formatMoney(md.catDiffs[cat.k].val)}`}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                );
            };

            // --- STREAMING_CHUNK:Targets Component ---
            const TargetsTab = () => {
                // Implementation minimized for brevity, assumes standard list
                return <div className="text-center text-slate-500 mt-10">目標功能模組已載入</div>;
            };

            // --- STREAMING_CHUNK:Main Layout ---
            return (
                <div className="min-h-screen bg-slate-950 text-slate-200">
                    {/* Header */}
                    <div className="fixed top-0 w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 z-40 px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20"><Icon name="shield" className="w-4 h-4 text-white" /></div>
                            <span className="font-bold text-lg tracking-tight text-white">AssetPilot</span>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => { playSfx('switch'); setIsPrivacyMode(!isPrivacyMode); }} className={`p-2 rounded-full transition-colors ${isPrivacyMode ? 'bg-indigo-500/20 text-indigo-400' : 'bg-slate-800 text-slate-400'}`}>
                                <Icon name={isPrivacyMode ? 'eye-off' : 'eye'} className="w-4 h-4" />
                            </button>
                            <div className="flex items-center gap-2 bg-slate-800 rounded-full pl-1 pr-3 py-1 cursor-pointer" onClick={() => setActiveTab('settings')}>
                                <div className="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center"><Icon name="user" className="w-3 h-3 text-slate-300" /></div>
                                <span className="text-xs font-bold text-slate-200 truncate max-w-[80px]">{userName}</span>
                            </div>
                        </div>
                    </div>

                    {/* Toast */}
                    {toast.show && (
                        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-white px-4 py-2 rounded-full shadow-lg shadow-emerald-500/20 text-sm font-bold animate-fade-in flex items-center gap-2">
                            <Icon name="check-circle" className="w-4 h-4" /> {toast.message}
                        </div>
                    )}

                    {/* Main Content */}
                    <div className="pt-20 px-4 max-w-lg mx-auto">
                        {activeTab === 'dashboard' && <DashboardTab />}
                        {activeTab === 'wallet' && <VaultTab />}
                        {activeTab === 'targets' && <TargetsTab />}
                        {activeTab === 'reports' && <ReportsTab />}
                        {activeTab === 'settings' && (
                            <div className="space-y-4 pb-20 animate-fade-in">
                                <div className="glass-panel p-4 rounded-2xl">
                                    <h3 className="text-xs text-slate-400 font-bold mb-3">基本設定</h3>
                                    <div className="space-y-3">
                                        <div><label className="text-xs text-slate-500 mb-1 block">指揮官代號</label><input type="text" value={userName} onChange={e => setUserName(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white" /></div>
                                        <div className="flex items-center justify-between p-3 bg-slate-900 rounded-xl border border-slate-700">
                                            <span className="text-sm">音效回饋</span>
                                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-12 h-6 rounded-full relative transition-colors ${soundEnabled ? 'bg-blue-500' : 'bg-slate-600'}`}><div className={`w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform ${soundEnabled ? 'translate-x-6' : 'translate-x-0.5'}`}></div></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modals */}
                    {updateModal.show && (
                        <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold text-lg mb-4 text-white flex items-center gap-2"><Icon name="radio" className="w-5 h-5 text-blue-400" /> 更新報告</h3>
                                <div className="max-h-60 overflow-y-auto space-y-2 mb-6 hide-scrollbar">
                                    {updateModal.logs.map((log, i) => (
                                        <div key={i} className={`text-xs p-2 rounded border ${log.includes('失敗') || log.includes('未獲取') ? 'bg-red-500/10 border-red-500/20 text-red-300' : (log.includes('無變動') ? 'bg-slate-800 border-slate-700 text-slate-400' : 'bg-blue-500/10 border-blue-500/20 text-blue-300')}`}>{isPrivacyMode ? log.replace(/[\d,.]+/g, '****') : log}</div>
                                    ))}
                                </div>
                                <button onClick={() => setUpdateModal({ show: false, logs: [] })} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-colors">確認</button>
                            </div>
                        </div>
                    )}

                    {confirmModal.show && (
                        <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold text-lg mb-2 text-white">{confirmModal.title}</h3>
                                <p className="text-sm text-slate-400 mb-6">{confirmModal.msg}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmModal({ show: false, title: '', msg: '', onConfirm: null })} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-colors">取消</button>
                                    <button onClick={() => { if(confirmModal.onConfirm) confirmModal.onConfirm(); setConfirmModal({ show: false, title: '', msg: '', onConfirm: null }); }} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-colors shadow-lg shadow-blue-900/20">確定</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bottom Nav */}
                    <div className="fixed bottom-0 w-full bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 z-40 pb-safe">
                        <div className="flex justify-around items-center p-2">
                            {[ { id: 'dashboard', icon: 'pie-chart', label: '戰情' }, { id: 'wallet', icon: 'briefcase', label: '金庫' }, { id: 'targets', icon: 'target', label: '目標' }, { id: 'reports', icon: 'bar-chart-2', label: '分析' } ].map(tab => (
                                <button key={tab.id} onClick={() => { playSfx('tap'); setActiveTab(tab.id); }} className={`flex flex-col items-center justify-center w-16 h-14 rounded-2xl transition-all ${activeTab === tab.id ? 'bg-blue-600/10 text-blue-400 scale-105' : 'text-slate-500 hover:text-slate-300'}`}>
                                    <Icon name={tab.icon} className={`w-5 h-5 mb-1 ${activeTab === tab.id ? 'animate-bounce-slight' : ''}`} />
                                    <span className="text-[10px] font-bold">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
